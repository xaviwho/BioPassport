version: '3.8'

# BioPassport V2 - Production Stack
# PureChain + PostgreSQL + MinIO + Services

services:
  # ==================== Database ====================
  postgres:
    image: postgres:15-alpine
    container_name: biopassport-db
    environment:
      POSTGRES_DB: biopassport
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5433:5432"
    networks:
      - biopassport-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Object Storage ====================
  minio:
    image: minio/minio:latest
    container_name: biopassport-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - biopassport-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: biopassport-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/biopassport --ignore-existing;
      mc mb myminio/credentials --ignore-existing;
      mc mb myminio/evidence --ignore-existing;
      mc mb myminio/audit-packs --ignore-existing;
      exit 0;
      "
    networks:
      - biopassport-network

  # ==================== Blockchain (PureChain) ====================
  purechain-node1:
    image: purechain/node:latest
    container_name: biopassport-node1
    environment:
      - PURECHAIN_NODE_ID=node1
      - PURECHAIN_ORG_ID=Org1MSP
      - PURECHAIN_NETWORK_ID=biopassport-network
      - PURECHAIN_CONSENSUS=raft
      - PURECHAIN_GENESIS_BLOCK=/config/genesis.block
      - PURECHAIN_RPC_PORT=8547
    volumes:
      - ./config/purechain:/config
      - purechain-node1-data:/var/purechain/data
    ports:
      - "7051:7051"
      - "8547:8547"
    networks:
      - biopassport-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8547"]
      interval: 10s
      timeout: 5s
      retries: 10

  purechain-node2:
    image: purechain/node:latest
    container_name: biopassport-node2
    environment:
      - PURECHAIN_NODE_ID=node2
      - PURECHAIN_ORG_ID=Org2MSP
      - PURECHAIN_NETWORK_ID=biopassport-network
      - PURECHAIN_CONSENSUS=raft
      - PURECHAIN_GENESIS_BLOCK=/config/genesis.block
    volumes:
      - ./config/purechain:/config
      - purechain-node2-data:/var/purechain/data
    ports:
      - "8051:7051"
    networks:
      - biopassport-network
    depends_on:
      - purechain-node1

  purechain-orderer:
    image: purechain/orderer:latest
    container_name: biopassport-orderer
    environment:
      - PURECHAIN_ORDERER_TYPE=raft
      - PURECHAIN_NETWORK_ID=biopassport-network
    volumes:
      - ./config/purechain:/config
      - purechain-orderer-data:/var/purechain/orderer
    ports:
      - "7050:7050"
    networks:
      - biopassport-network

  # Contract deployment
  contract-deploy:
    image: node:20-alpine
    container_name: biopassport-deploy
    working_dir: /app
    command: sh -c "npm install && npx hardhat run scripts/deploy-v2.ts --network purechain"
    environment:
      - HARDHAT_NETWORK=purechain
    volumes:
      - ./contracts:/app
    networks:
      - biopassport-network
    depends_on:
      purechain-node1:
        condition: service_healthy

  # ==================== Services ====================
  
  # Indexer - listens to chain events, populates DB
  indexer:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: biopassport-indexer
    command: npm run indexer
    environment:
      - RPC_URL=http://purechain-node1:8547
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/biopassport
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - CHAIN_ID=900520900520
      - START_BLOCK=0
      - POLL_INTERVAL_MS=2000
    networks:
      - biopassport-network
    depends_on:
      postgres:
        condition: service_healthy
      purechain-node1:
        condition: service_healthy
    restart: unless-stopped

  # API - REST interface for acquirers
  api:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: biopassport-api
    command: npm run api
    environment:
      - PORT=3000
      - RPC_URL=http://purechain-node1:8547
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/biopassport
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - CHAIN_ID=900520900520
      - PRIVATE_KEY=${PRIVATE_KEY}
      - STORAGE_ENDPOINT=minio
      - STORAGE_PORT=9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=biopassport
    ports:
      - "3000:3000"
    networks:
      - biopassport-network
    depends_on:
      postgres:
        condition: service_healthy
      purechain-node1:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  biopassport-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  purechain-node1-data:
  purechain-node2-data:
  purechain-orderer-data:
