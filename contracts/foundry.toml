[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/"
]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 10000, seed = "0x42" }
invariant = { runs = 256, depth = 15 }

[profile.ci]
fuzz = { runs = 50000 }
invariant = { runs = 512, depth = 25 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[doc]
out = "docs"
title = "BioPassport Registry"
