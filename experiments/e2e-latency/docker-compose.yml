services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile
    image: biopassport-minio-netem:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9010:9000"
      - "9011:9001"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./minio-data:/data
