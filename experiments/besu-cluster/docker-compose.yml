    <<: *besu-common
    container_name: besu-1
    profiles: ["s1", "s3", "s5", "s7"]
    volumes:
      - ./node1:/data
      - ./genesis.json:/genesis.json:ro
    networks:
      besunet:
        ipv4_address: 172.28.1.11
    command:
      - --data-path=/data
      - --genesis-file=/genesis.json
      - --network-id=2026
      - --rpc-http-enabled
      - --rpc-http-api=ETH,NET,WEB3,CLIQUE,ADMIN
      - --rpc-http-host=0.0.0.0
